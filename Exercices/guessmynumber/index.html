<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header></header>
    <main>
      <section>
        <p>
          Joueur 1 : Entrer le nombre à faire deviner compris entre 0 et 50.
        </p>
        <input
          type="number"
          id="inputPlayerOne"
          name="inputPlayerOne"
          placeholder="Choississez un nombre"
          required
        />
        <button id="buttonPlayerOne" type="submit">Envoyer</button>
        <p>
          Joueur 2 : Essayer de deviner le nombre proposé par le joueur 1
          (compris en 0 et 50.)
        </p>
        <input
          type="number"
          id="inputPlayerTwo"
          name="inputPlayerTwo"
          placeholder="Entrer votre nombre"
          required
        />
        <button id="buttonPlayerTwo" type="submit">Envoyer</button>
      </section>
      <section></section>
    </main>
    <footer></footer>
    <script src="script.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mini Cookie Clicker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Bouton règles -->
    <button id="rulesBtn">Règles du jeu</button>

    <!-- Score -->
    <div class="score-container">
      <h1>Score</h1>
      <p id="score">0</p>
    </div>

    <!-- Zone principale -->
    <div class="game-container">
      <img
        src="https://cdn-icons-png.flaticon.com/512/1047/1047711.png"
        alt="cookie"
        id="cookie"
      />
    </div>

    <!-- Zone améliorations -->
    <div class="upgrades">
      <button class="upgrade-btn">+1 par clic</button>
      <button class="upgrade-btn">Auto click</button>
    </div>

    <!-- Pop-up règles -->
    <div class="modal" id="rulesModal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Règles du jeu</h2>
        <p>
          🍪 Clique sur le cookie pour gagner des points.<br /><br />
          ⌨️ Certaines touches du clavier peuvent donner des bonus.<br /><br />
          💰 Achète des améliorations pour gagner plus rapidement !
        </p>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>

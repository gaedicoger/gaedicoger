<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <form>
        <h3>Prise de contact</h3>
        <br />
        <div class="inputForm">
          <label for="inputLastName">Nom :</label>
          <input
            type="text"
            id="inputLastName"
            name="Lastname"
            placeholder="Nom"
          />
          <br />
        </div>
        <div class="inputForm">
          <label for="inputFirstName">Prénom :</label>
          <input
            type="text"
            id="inputFirstName"
            name="Firstname"
            placeholder="Prénom"
            required
          />
          <br />
        </div>
        <div class="inputForm">
          <label for="inputMail">Mail :</label>
          <input
            type="email"
            id="inputMail"
            name="email"
            placeholder="Adresse mail"
            required
          />
          <br />
        </div>
        <div class="inputForm">
          <label for="inputObject">Objet du message</label>
          <select id="inputObject" name="object" required>
            <option value="">-- Sélectionnez un objet --</option>
            <option value="e-learning">Conception e-learning</option>
            <option value="vitrine">Conception site vitrine</option>
            <option value="appli">Conception d'applications</option>
            <option value="coaching">Coaching pédagogique</option>
            <option value="LMS">Deploiement LMS</option>
            <option value="video">Montage vidéo</option></select
            <option value="autre">Autres</option>
            </select
          ><br />
        </div>
        <div class="inputForm">
          <label for="messageBox">Message</label>
          <textarea
            id="messageBox"
            name="Message"
            placeholder="Message"
            rows="4"
            cols="30"
          ></textarea>
          <br />
        </div>
        <div class="inputForm">
          <label for="inputCheckbox">Je m'inscris à la newsletter</label>
          <input type="checkbox" id="inputNewsletter" name="Newsletter" />
          <br />
        </div>
        <div class="inputForm"><button type="submit">Envoyer</button></div>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
